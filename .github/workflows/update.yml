name: Měření a zveřejnění

on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mereni
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Uspořádat soubory do složek
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data scripts
          for f in teploty.csv 20[0-9][0-9]-[0-9][0-9].csv; do [ -f "$f" ] && git mv -f "$f" data/; done
          [ -f gen.py ] && git mv -f gen.py scripts/gen.py
          [ -f update.yml ] && git rm -q update.yml
          if ! git diff --cached --quiet; then git commit -m "Uspořádání souborů" && git push; fi
      - name: Doplnit nová měření
        if: github.event_name != 'push'
        run: |
          python scripts/gen.py data
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Nové měření $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
